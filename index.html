<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do List - Modul 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-app">
        <h2>Daftar Tugas Saya</h2>

        <!-- Fitur 1: Penghitung jumlah tugas -->
        <p class="task-counter" id="totalTugas" aria-live="polite">Total: 0 Tugas | Selesai: 0 | Belum Selesai: 0</p>

        <!-- Form Input Tugas -->
        <form id="todoForm" novalidate>
            <div class="input-section">
                <input type="text" id="taskInput" placeholder="Ketikkan tugas baru Anda...">
                <button type="submit" class="add-btn">Tambah</button>
            </div>
            <div class="error-message" id="inputError">Tugas tidak boleh kosong atau kurang dari 3 karakter!</div>
        </form>

        <!-- Daftar Tugas -->
        <ul class="todo-list" id="todoList"></ul>

        <!-- Fitur 2: Tombol bersihkan tugas selesai -->
        <button type="button" class="clear-completed-btn" id="clearCompletedBtn">Bersihkan Tugas Selesai</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
